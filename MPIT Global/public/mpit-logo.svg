<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;family=Merriweather:wght@400;700;900&amp;display=swap');
      .brand-mpit {
        font-family: 'Merriweather', 'Cinzel', 'Times New Roman', Georgia, serif;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .brand-global {
        font-family: 'Merriweather', 'Playfair Display', Georgia, serif;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
    </style>
    <!-- Subtle tech constellation nodes in background -->
    <pattern id="tech-dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#38A3DC" fill-opacity="0.15" />
    </pattern>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46B2EA" />
      <stop offset="100%" stop-color="#2D92C9" />
    </linearGradient>
  </defs>

  <!-- Background Tech Geometry / Constellation lines -->
  <g stroke="#38A3DC" stroke-width="1" stroke-opacity="0.16" stroke-dasharray="3 3">
    <line x1="80" y1="70" x2="180" y2="40" />
    <line x1="180" y1="40" x2="350" y2="55" />
    <line x1="350" y1="55" x2="430" y2="110" />
    <line x1="60" y1="180" x2="140" y2="240" />
    <line x1="140" y1="240" x2="280" y2="260" />
    <line x1="280" y1="260" x2="420" y2="220" />
    <line x1="70" y1="110" x2="120" y2="190" />
    <line x1="380" y1="80" x2="440" y2="190" />
  </g>
  <g fill="#38A3DC" fill-opacity="0.25">
    <circle cx="80" cy="70" r="3" />
    <circle cx="180" cy="40" r="2.5" />
    <circle cx="350" cy="55" r="3" />
    <circle cx="430" cy="110" r="2.5" />
    <circle cx="60" cy="180" r="3" />
    <circle cx="140" cy="240" r="2.5" />
    <circle cx="280" cy="260" r="3" />
    <circle cx="420" cy="220" r="3" />
  </g>

  <!-- Top-Left Corner Bracket (Sky Blue #38A3DC) -->
  <path d="M 12 150 L 12 18 L 165 18 L 165 38 L 34 38 L 34 150 Z" fill="url(#bracketGrad)" />

  <!-- Bottom-Right Corner Bracket (Sky Blue #38A3DC) -->
  <path d="M 488 150 L 488 282 L 335 282 L 335 262 L 466 262 L 466 150 Z" fill="url(#bracketGrad)" />

  <!-- MPIT Text (Navy Blue #1B365D) -->
  <text 
    x="250" 
    y="160" 
    text-anchor="middle" 
    class="brand-mpit text-navy" 
    fill="#1B365D" 
    font-size="108"
  >MPIT</text>

  <!-- global Text (Navy Blue #1B365D) -->
  <text 
    x="250" 
    y="226" 
    text-anchor="middle" 
    class="brand-global text-navy" 
    fill="#1B365D" 
    font-size="64"
  >global</text>
</svg>
